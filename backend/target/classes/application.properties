spring.application.name=expense-tracker-backend
server.port=${PORT:8080}

# ---------------------------------------------------------
# OPTION A: MySQL (default) - make sure MySQL is running and
# a database called `expense_tracker` exists.
# ---------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/expense_tracker?allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=divyansh
spring.datasource.password=divyansh
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ---------------------------------------------------------
# OPTION B: H2 in-memory DB (great for quick local testing,
# no external DB required). Comment out OPTION A above and
# uncomment the four lines below to switch to H2.
# ---------------------------------------------------------
# spring.datasource.url=jdbc:h2:mem:expensedb;DB_CLOSE_DELAY=-1
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT config
jwt.secret=ChangeThisSecretKeyToSomethingLongAndRandomForProductionUse1234567890
jwt.expiration.ms=86400000

# CORS - Next.js dev server
app.cors.allowed-origins=http://localhost:3000
